<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Music Visualizer AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/visualizer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/player.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/lyrics.css') }}">
    
    <style>
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff416c; }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-mode {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer;
            font-size: 11px; transition: 0.2s; margin: 0 3px;
        }
        .btn-mode:hover { background: #ff416c; border-color: #ff416c; transform: scale(1.05); }
    </style>
</head>
<body>
    <style>
        /* CSS NỘI BỘ (Để các nút hoạt động ngay mà không cần sửa file CSS nhiều) */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff416c; }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-mode {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 6px 12px; border-radius: 20px; cursor: pointer;
            font-size: 11px; transition: 0.2s; margin: 0 3px;
        }
        .btn-mode:hover { background: #ff416c; border-color: #ff416c; transform: scale(1.05); }
        
        /* STYLE CHO THANH CHỌN THỂ LOẠI (MỚI) */
        .genre-selector {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; scrollbar-width: none;
        }
        .genre-selector::-webkit-scrollbar { display: none; }
        .genre-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ccc; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
            white-space: nowrap; transition: all 0.3s ease;
        }
        .genre-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
        .genre-btn.active { background: #ff416c; border-color: #ff416c; color: white; font-weight: bold; box-shadow: 0 4px 10px rgba(255, 65, 108, 0.4); }

        .playlist-section ul li { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .playlist-section ul li:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="background-animate"></div>

    <div class="app-container">
        
        <div id="sidePanel" class="side-panel">
            <div class="panel-header">
                <h3>🔍 YouTube & Playlist</h3>
                <button id="closePanelBtn"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Nhập tên bài hát...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div id="loadingText" style="display:none; color:#ff416c; font-size:12px; margin:5px 0;">⏳ Đang tìm kiếm...</div>

            <div class="ai-setting" style="margin: 15px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                <span style="color: #fff; font-size: 13px;"><i class="fas fa-robot"></i> AI Lyric:</span>
                <label class="switch">
                    <input type="checkbox" id="aiToggle" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="recommend-section">
                <h3 style="color: #fff; margin-bottom: 10px; font-weight: 600; font-size: 15px;">🔥 Có thể bạn sẽ thích</h3>
                
                <div class="genre-selector">
                    <button class="genre-btn active" onclick="filterMusic('all', this)">🔥 Tất cả</button>
                    <button class="genre-btn" onclick="filterMusic('lofi', this)">☕ Lofi</button>
                    <button class="genre-btn" onclick="filterMusic('rap', this)">🎤 Rap</button>
                    <button class="genre-btn" onclick="filterMusic('ballad', this)">💧 Ballad</button>
                    <button class="genre-btn" onclick="filterMusic('karaoke', this)">🎹 Karaoke</button>
                    <button class="genre-btn" onclick="filterMusic('remix', this)">🚀 Remix</button>
                </div>

                <div id="recommendLoading" style="color: #aaa; font-size: 14px; text-align: center;">
                    <i class="fas fa-circle-notch fa-spin"></i> Đang cập nhật nhạc hot...
                </div>
                <div class="recommend-grid" id="recommendGrid"></div>
            </div>

            <div class="playlist-section" style="margin-top: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 style="margin:0; font-size:14px; color:#ffe600;"><i class="fas fa-list"></i> PLAYLIST CỦA TÔI</h3>
                    <button id="clearPlaylist" style="background:none; border:none; color:#f55; font-size:11px; cursor:pointer;">(Xóa hết)</button>
                </div>
                <ul id="playlistUl" style="list-style:none; padding:0; max-height: 200px; overflow-y: auto;">
                    <li style="color:#777; font-size:12px; text-align:center; padding:10px;">(Chưa có bài nào)</li>
                </ul>
            </div>

            <div class="history-list">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h4 style="margin:0; font-size:14px; color:#aaa;"><i class="fas fa-history"></i> Lịch sử phát</h4>
                    <button id="clearHistory" style="background:none; border:none; color:#f55; font-size:11px; cursor:pointer;">(Xóa)</button>
                </div>
                <ul id="historyUl" class="music-list"></ul>
            </div>
            
            <div style="height: 50px;"></div>
        </div>

        <div class="stage">
            <div class="bg-image" id="bgImage"></div>
            <div class="overlay"></div>
            <canvas id="visualizer"></canvas>
            <div id="karaokeBox" class="karaoke-container"></div>
        </div>

        <div class="control-deck">
            
            <div class="track-info">
                <div class="song-info-container" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                    <div class="song-title" id="audioName" style="max-width: 80%;">🎵 Chọn bài hát để bắt đầu...</div>
                    <button id="mainAddBtn" title="Thêm bài này vào Playlist" style="display:none; background:none; border:none; color:#0f0; font-size:18px; cursor:pointer; transition:0.2s;">
                        <i class="fas fa-plus-circle"></i>
                    </button>
                </div>
                
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <div class="progress-bar-wrapper" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="duration">00:00</span>
                </div>

                <div class="voice-controls" style="display: flex; gap: 5px; justify-content: center; margin-top: 10px; flex-wrap: wrap;">
                    <button onclick="changeVoice('original')" class="btn-mode">🎵 Gốc</button>
                    <button onclick="changeVoice('karaoke')" class="btn-mode">🎤 Karaoke</button>
                    <button onclick="changeVoice('vocal_only')" class="btn-mode">🗣️ Vocal</button>
                    <button onclick="changeVoice('chipmunk')" class="btn-mode">🐿️ Chipmunk</button>
                    <button onclick="changeVoice('deep')" class="btn-mode">👹 Deep</button>
                </div>
                <div id="processingMsg" style="text-align:center; color:#ffe600; font-size:11px; margin-top:5px; display:none;">
                    ⏳ AI đang xử lý tách nhạc (1-2 phút)...
                </div>
            </div>

            <div class="main-controls">
                
                <div class="side-controls">
                    <button id="togglePanelBtn" class="btn-icon" title="Playlist & Lịch sử"><i class="fas fa-bars"></i></button>
                    
                    <div class="upload-btn-wrapper" title="Chọn file nhạc">
                        <button class="btn-icon"><i class="fas fa-music"></i></button>
                        <input type="file" id="audioFile" accept="audio/*">
                    </div>
                    <div class="upload-btn-wrapper" title="Đổi ảnh nền">
                        <button class="btn-icon"><i class="fas fa-image"></i></button>
                        <input type="file" id="imageFile" accept="image/*">
                    </div>
                </div>

                <div class="center-play">
                    <button id="playBtn" class="btn-circle btn-play"><i class="fas fa-play"></i></button>
                    <button id="pauseBtn" class="btn-circle btn-play" style="display:none"><i class="fas fa-pause"></i></button>
                </div>

                <div class="side-controls">
                    <button id="loopBtn" class="btn-icon" title="Lặp lại"><i class="fas fa-redo"></i></button>

                    <button id="recordBtn" class="btn-pill record"><i class="fas fa-circle"></i> REC</button>
                    <button id="stopRecordBtn" class="btn-pill stop" style="display:none"><i class="fas fa-stop"></i> STOP</button>
                    
                    <button id="modeToggle" class="btn-icon" title="Đổi kiểu sóng"><i class="fas fa-wave-square"></i></button>
                </div>
            </div>

            <div class="settings-bar">
                <div class="setting-group">
                    <i class="fas fa-tachometer-alt" title="Tốc độ"></i>
                    <input type="range" id="speedRange" min="0.5" max="1.5" step="0.05" value="1">
                    <span id="speedLabel" class="value-label">x1.0</span>
                </div>

                <div class="setting-group">
                    <i class="fas fa-volume-up" title="Âm lượng"></i>
                    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
                </div>

                <div class="setting-group">
                    <i class="fas fa-palette" title="Giao diện"></i>
                    <select id="themeSelect" class="custom-select">
                        <option value="red">🔥 Red Neon</option>
                        <option value="blue">🌊 Blue Chill</option>
                        <option value="purple">🔮 Purple Night</option>
                    </select>
                    <input type="color" id="colorPicker" value="#ff416c" style="height: 35px; width: 40px; border: none; cursor: pointer; background: none;">
                </div>
            </div>

        </div> 
    </div>
  
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script></body>
</html>
